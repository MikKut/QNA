project:
  name: "QNA-QNN-MNIST"
  seed: 42
  output_root: "./runs"
  deterministic_torch: false


paths:
  data_root: "./data"
  X_train_pca: "./data/X_train_pca.npy"
  X_val_pca:   "./data/X_val_pca.npy"
  X_test_pca:  "./data/X_test_pca.npy"
  y_train: "./data/y_train.npy"
  y_val:   "./data/y_val.npy"
  y_test:  "./data/y_test.npy"
  pca_meta: "./data/pca_meta.npz"
  preprocess_stats: "./data/preprocess_stats.yaml"
  z_cache:
    train: "./data/Z_train_std.npy"
    val:   "./data/Z_val_std.npy"
    test:  "./data/Z_test_std.npy"

data:
  n_classes: 10
  train_path: "./data/X_train_pca.npy"   # дефолт — існуючі PCA-файли
  val_path:   "./data/X_val_pca.npy"
  test_path:  "./data/X_test_pca.npy"

  train_phi: "./data/train_phi.npz"   # {phi: (N,8), y: (N,)}
  val_phi:   "./data/val_phi.npz"
  test_phi:  "./data/test_phi.npz"

angles:                     # використовується у тренуванні (онлайн)
  k: 2.5
  angle_max: 3.141592653589793
  clip: true

run:
  stage: "both"            # "preprocess" | "train" | "both"

pixels:
  scale_to_unit: true
  dtype: "float32"

split:
  make_val_split: true
  val_size: 10000
  stratify: true
  shuffle: true
  split_seed: 42

pca:
  dim: 8
  whiten: false            # абляція C
  svd_solver: "auto"
  random_state: 42
  save_extras: true

scaler:                     # обирається на етапі fit (офлайн)
  method: "zscore"         # "zscore" | "robust" | "global_l2" | "maxabs"
  eps: 1.0e-8
  robust:
    kind: "mad"            # "mad" | "iqr"
    c_mad: 1.4826
    c_iqr: 1.349
  global:
    axis: "vector"

training:
  optimizer: "adam"        # "adam" | "qna_adam"
  lr: 0.001
  batch_size: 64
  epochs: 15
  grad_stats_interval: 100
  target_val_acc: 0.95
  weight_decay: 0.0
  grad_clip: 1.0
  accumulate_steps: 1
  num_workers: 0

diagnostics:
  prescreen_k: [1.5, 2.0, 2.5, 3.0, 3.5]
  save_tables_to: "./runs/preproc/diag_k.csv"
  save_stats_to:  "./runs/preproc/z_stats.json"
  make_plots: false

z_cache:
  enable: true
  fingerprint: true

logging:
  level: "INFO"
  dir: "./runs"
  preprocess_log: "./runs/preproc/preprocess.log"
  train_log: "./runs/train/train.log"

safety:
  overwrite: true
  assert_no_nan: true

csv:
  delimiter: ";"       
  excel_sep_hint: true  
  utf8_bom: true      

quantum:
  device: "default.qubit"
  shots: 100                 # для аналітики: поставити null
  n_layers: 2
  topology: "ring"
  reupload: true
  encoding: "ry"           # ry|rx|rz|xy — символи узгоджені з QuantumLayer, але не функціонал
  measurements: "ZX"        # "Z" | "ZX" | "ZXY" (оскільки поки у нас тільки ry - поки не має сенсу)
  diff_method: "parameter-shift"     # "adjoint" | "parameter-shift" | "finite-diff"
  eval_shots: 1000 
  reseed_each_epoch: false

optim:
  name: "adam"             # "adam" | "adamw" | "sgd" | "rmsprop" | "qna_adam"
  lr: 3.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  amsgrad: false
  maximize: false
  qna:
    clip_in_optimizer: false

schedules:
  shots:
    mode: "none"              # "none" | "linear"
    start: 100                 # значення на 1-й епосі
    end: 1000                  # значення на останній епосі
    epochs: 15                # протягом скількох епох робити інтерполяцію